[Application]
app.classpath=$APPDIR\LoadFlow-1.0.0-all.jar
app.mainclass=com.loadflow.LoadFlowApp

[JavaOptions]
java-options=-Djpackage.app-version=1.0
java-options=-XX:+UseG1GC
java-options=-XX:+UseStringDeduplication
java-options=-Dio.netty.allocator.type=pooled
java-options=-Dio.netty.leakDetection.level=DISABLED
