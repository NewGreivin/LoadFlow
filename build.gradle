plugins {
    id 'java'
    id 'application'
}

group = 'com.loadflow'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://repo.opencollab.dev/main/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Modern Dark FlatLaf UI
    implementation 'com.formdev:flatlaf:3.4.1'
    implementation 'com.formdev:flatlaf-extras:3.4.1'

    // Netty for fast asynchronous networking
    implementation 'io.netty:netty-all:4.1.108.Final'

    // JSON handling
    implementation 'com.google.code.gson:gson:2.10.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.loadflow.LoadFlowApp'
    applicationDefaultJvmArgs = [
        '-XX:+UseG1GC',
        '-XX:+UseStringDeduplication',
        '-Dio.netty.allocator.type=pooled',
        '-Dio.netty.leakDetection.level=DISABLED'
    ]
}

jar {
    manifest {
        attributes 'Main-Class': 'com.loadflow.LoadFlowApp'
    }
}

tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.loadflow.LoadFlowApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    with jar
}

tasks.register('packageExe', Exec) {
    dependsOn fatJar
    doFirst {
        delete 'dist'
    }
    workingDir projectDir
    commandLine 'C:/Users/Greivin Eliecer A.G/AppData/Local/Programs/Eclipse Adoptium/jdk-17.0.20.101-hotspot/bin/jpackage.exe',
            '--type', 'app-image',
            '--name', 'LoadFlow',
            '--input', 'build/libs',
            '--main-jar', 'LoadFlow-1.0.0-all.jar',
            '--main-class', 'com.loadflow.LoadFlowApp',
            '--java-options', '-XX:+UseG1GC',
            '--java-options', '-XX:+UseStringDeduplication',
            '--java-options', '-Dio.netty.allocator.type=pooled',
            '--java-options', '-Dio.netty.leakDetection.level=DISABLED',
            '--dest', 'dist'
}

test {
    useJUnitPlatform()
}
